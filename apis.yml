- aid: theholisticcare:thc-open-mindfulness-mcp-server
  name: THC Open Mindfulness MCP Server
  description: >-
    Production remote MCP server (streamable HTTP, serverInfo thc-open-mindfulness "THC Open Mindfulness MCP" 1.0.0) with seven
    read-only, unauthenticated tools (search_mindfulness_resources, get_mindfulness_resource, find_mindfulness_games, find_guided_practices,
    search_mindfulness_research, lookup_mindfulness_term, find_panchavikas_resources) and five markdown resources over The Holistic Care's
    public mindfulness games, guided practices, research, glossary and PanchaVikas resources. Listed in the official MCP Registry as
    com.theholisticcare/open-mindfulness; MIT-licensed source on GitHub.
  humanURL: https://github.com/mohanagc/thc-mindfulness-mcp
  baseURL: https://mcp.theholisticcare.com/mcp
